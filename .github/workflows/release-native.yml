name: Release Native Apps (Windows .exe & Android .apk)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Native App (.exe / .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies & run tests
        run: |
          npm ci
          npm test

      - name: Build Tauri Windows Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'native-latest' }}
          releaseName: 'Mimir Native Release'
          releaseBody: 'Automated Windows (.exe/.msi) and Android (.apk) native builds of Mimir.'
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mimir-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 30

  build-android:
    name: Build Android Native App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.3.11579264'

      - name: Install Rust stable with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies & Tauri CLI
        run: |
          npm ci
          npm install --no-save @tauri-apps/cli@^2

      - name: Initialize & Build Android APK (arm64)
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mimir-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Android APK (arm64 fallback path)
        uses: actions/upload-artifact@v4
        with:
          name: mimir-android-arm64-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
          if-no-files-found: warn
          retention-days: 30
